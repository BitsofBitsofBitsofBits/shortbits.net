name: Validate and deploy site

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-site
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: find . -type f -name '*.js' -not -path './.git/*' -print0 | xargs -0 -n1 node --check

      - name: Validate site assets
        run: node scripts/validate-site.mjs

      - name: Scan committed content for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  supabase:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: arjwrycitgobvlodmkeo
    steps:
      - name: Check Supabase credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN or SUPABASE_DB_PASSWORD is not set; skipping database migrations and Edge Function deploys."
          fi

      - name: Check out repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: steps.credentials.outputs.ready == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Sync Edge Function secrets
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        env:
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
        run: |
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY"
          else
            echo "TURNSTILE_SECRET_KEY is not set; the contact function will skip the Turnstile check."
          fi

      # The function must exist before the migration revokes direct inserts into messages.
      - name: Deploy contact Edge Function
        if: steps.credentials.outputs.ready == 'true'
        run: >-
          supabase functions deploy contact-message
          --project-ref "$SUPABASE_PROJECT_REF"
          --no-verify-jwt
          --use-api

      - name: Apply database migrations
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

  deploy:
    # Front-end features degrade gracefully, so the site still ships if the Supabase job fails.
    if: >-
      always()
      && needs.validate.result == 'success'
      && github.event_name != 'pull_request'
      && github.ref == 'refs/heads/main'
    needs: [validate, supabase]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate build metadata
        shell: bash
        run: |
          cat > build-info.json <<EOF
          {
            "commit": "${GITHUB_SHA}",
            "builtAt": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF

      - name: Configure SSH
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy static site
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: |
          rsync \
            --archive \
            --checksum \
            --compress \
            --chmod=D755,F644 \
            -e "ssh -p ${DEPLOY_PORT}" \
            404.html \
            admin.html \
            admin \
            build-info.json \
            chooser.css \
            index.html \
            ./*.js \
            robots.txt \
            sitemap.xml \
            source.html \
            styles.css \
            useless.html \
            blog \
            boot \
            online \
            professional \
            images \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/srv/bitsofbits/"

      - name: Allow approved ShortBit embeds
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          CADDYFILE_PATH: /etc/caddy/Caddyfile
        run: |
          set -euo pipefail
          scp -P "${DEPLOY_PORT}" \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${CADDYFILE_PATH}" \
            /tmp/Caddyfile.original
          cp /tmp/Caddyfile.original /tmp/Caddyfile.candidate
          node scripts/update-caddy-csp.mjs /tmp/Caddyfile.candidate
          scp -P "${DEPLOY_PORT}" \
            /tmp/Caddyfile.original \
            /tmp/Caddyfile.candidate \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/tmp/"
          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -eu; \
            caddy validate --config /tmp/Caddyfile.candidate --adapter caddyfile; \
            persisted=false; \
            if cp /tmp/Caddyfile.candidate '${CADDYFILE_PATH}' 2>/dev/null; then \
              persisted=true; \
            else \
              echo 'Caddyfile is not writable; applying through the Caddy admin API.'; \
            fi; \
            if ! caddy reload --config /tmp/Caddyfile.candidate --adapter caddyfile; then \
              if [ \"\$persisted\" = true ]; then \
                cp /tmp/Caddyfile.original '${CADDYFILE_PATH}'; \
              fi; \
              caddy reload --config /tmp/Caddyfile.original --adapter caddyfile; \
              exit 1; \
            fi; \
            rm -f /tmp/Caddyfile.original /tmp/Caddyfile.candidate"

  lighthouse:
    if: always() && needs.deploy.result == 'success'
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit live pages
        shell: bash
        run: |
          mkdir -p lighthouse-reports
          for page in "" "online/" "professional/" "professional/resume/"; do
            name="$(echo "${page:-chooser}" | tr '/' '-' | sed 's/-$//')"
            for preset in mobile desktop; do
              flags=""
              if [ "$preset" = "desktop" ]; then flags="--preset=desktop"; fi
              npx --yes lighthouse@12 "https://www.shortbits.net/${page}" $flags \
                --only-categories=performance,accessibility,best-practices,seo \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="lighthouse-reports/${name}-${preset}.json" \
                --quiet || echo "::warning::Lighthouse failed for /${page} (${preset})"
            done
          done
          node scripts/lighthouse-summary.mjs lighthouse-reports

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: lighthouse-reports
          retention-days: 14
