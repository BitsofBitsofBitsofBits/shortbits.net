name: Monitor public site

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      expected-commit:
        type: string
        required: false
        default: ""

permissions:
  contents: read
  issues: write

concurrency:
  group: public-site-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure existing deployment SSH access
        shell: bash
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify remote curl without modifying the host
        env:
          SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=10 -p "$SSH_PORT" -- "$SSH_TARGET" 'command -v curl >/dev/null && curl --version | head -n 1'

      - name: Check public pages and integrations
        id: health
        env:
          SITE_EXPECTED_COMMIT: ${{ inputs.expected-commit }}
          SITE_MONITOR_SSH_TARGET: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
          SITE_MONITOR_SSH_PORT: ${{ vars.DEPLOY_PORT || '22' }}
        run: node scripts/monitor-site.mjs --output health-report.json --ssh

      - name: Publish health summary
        if: always()
        shell: bash
        run: |
          if [ -f health-report.json.md ]; then
            cat health-report.json.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Health monitor could not produce a report. Inspect the workflow logs." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Update outage issue or close it on recovery
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- shortbits-site-monitor -->'
          issue="$(gh issue list --state open --app github-actions --search 'Site monitor in:title' --limit 100 --json number,body --jq '.[] | select(.body | contains("<!-- shortbits-site-monitor -->")) | .number' | head -n 1)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$HEALTH_OUTCOME" = "success" ]; then
            if [ -n "$issue" ]; then
              gh issue close "$issue" --comment "Public health checks have recovered. Verified by ${run_url}."
            fi
          else
            printf '%s\n\nPublic health checks failed. Latest run: %s\n\n' "$marker" "$run_url" > /tmp/site-monitor-issue.md
            if [ -f health-report.json.md ]; then
              cat health-report.json.md >> /tmp/site-monitor-issue.md
            else
              printf '%s\n' 'No report was produced; inspect the linked workflow logs.' >> /tmp/site-monitor-issue.md
            fi
            if [ -n "$issue" ]; then
              gh issue edit "$issue" --body-file /tmp/site-monitor-issue.md
            else
              gh issue create --title "[Site monitor] Public health checks failing" --body-file /tmp/site-monitor-issue.md
            fi
          fi

      - name: Retain sanitized health report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-health
          path: |
            health-report.json
            health-report.json.md
          if-no-files-found: warn
          retention-days: 14
