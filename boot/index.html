<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#020806">
    <title>BitsofBitsofBits // ENDLESS BOOT</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <script src="/theme-init.js?v=theme-12"></script>
    <link rel="stylesheet" href="/styles.css?v=upgrade-94">
    <script src="/messages.js?v=messages-13" defer></script>
    <script src="/seasonal-messages.js?v=seasonal-3" defer></script>
    <script src="/endless-boot.js?v=endless-boot-8" defer></script>
  </head>
  <body class="endless-boot-page">
    <div class="noise" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="endless-boot-console" aria-labelledby="endless-boot-heading">
      <header class="endless-boot-header">
        <div>
          <p class="system-kicker">BITSOFBITS FIRMWARE // CONTINUOUS POST</p>
          <h1 id="endless-boot-heading">INITIALIZING INTERNET PRESENCE</h1>
        </div>
        <div class="endless-boot-indicators" aria-label="Boot status">
          <span><i></i> POWER</span>
          <span><i></i> SIGNAL</span>
          <span><i></i> BITS</span>
        </div>
      </header>
      <section class="endless-boot-transmission" aria-label="Current transmission">
        <span>NOW TRANSMITTING</span>
        <p id="endless-boot-message">retrieving Bits from the main process...</p>
      </section>
      <div class="endless-boot-status">
        <span>BOOT CYCLE <strong id="endless-boot-cycle">0001</strong></span>
        <span>MESSAGES <strong id="endless-boot-count">000000</strong></span>
        <span>ELAPSED <strong id="endless-boot-elapsed">00:00:00</strong></span>
      </div>
      <ol id="endless-boot-log" class="endless-boot-log" aria-live="off"></ol>
      <footer class="endless-boot-footer">
        <div class="endless-boot-progress" aria-hidden="true">
          <span id="endless-boot-progress-bar"></span>
        </div>
        <p><span id="endless-boot-stage">ENUMERATING SUSPICIOUS HARDWARE</span><b id="endless-boot-percent">0%</b></p>
      </footer>
      <aside class="endless-boot-settings">
        <div id="endless-boot-settings-panel" class="endless-boot-settings-panel" hidden>
          <p>DISPLAY_SETTINGS</p>
          <label>
            <span>INTERFACE THEME</span>
            <select id="endless-boot-theme" aria-label="Interface theme"></select>
          </label>
        </div>
        <a class="endless-boot-home" href="/" aria-label="Return to the home page">&larr; HOME</a>
        <button
          id="endless-boot-settings-toggle"
          type="button"
          aria-label="Open display settings"
          aria-controls="endless-boot-settings-panel"
          aria-expanded="false"
        >&#9881;</button>
      </aside>
    </main>
  </body>
</html>
