<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#070b0f">
    <title>404 // BIT_NOT_FOUND</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <script src="/theme-init.js?v=theme-12"></script>
    <link rel="stylesheet" href="/styles.css?v=upgrade-122">
    <script src="/supabase-config.js" defer></script>
    <script src="/shortbits.js?v=shortbits-1" defer></script>
    <script src="/not-found.js?v=404-5" defer></script>
    <script src="/site-config.js?v=site-config-3" defer></script>
    <script src="/cf-analytics.js?v=cf-analytics-2" defer></script>
  </head>
  <body class="error-page">
    <div class="noise" aria-hidden="true"></div>
    <div class="scanlines" aria-hidden="true"></div>
    <main class="error-window">
      <section id="error-content">
        <p id="error-kicker" class="system-kicker">ROUTING EXCEPTION</p>
        <p id="error-code" class="error-code" aria-label="Error 404">404</p>
        <h1 id="error-heading">BIT_NOT_FOUND</h1>
        <p id="error-copy">
          The requested page either escaped containment or was never compiled in
          the first place.
        </p>
        <p id="error-path"></p>
        <nav id="error-actions" class="error-actions" aria-label="Recovery options">
          <a href="/online/">&gt; RETURN_HOME</a>
          <a href="https://github.com/BitsofBitsofBitsofBits/shortbits.net" target="_blank" rel="noreferrer">&gt; VIEW_SOURCE</a>
        </nav>
        <p id="error-achievement" class="error-achievement" role="status" aria-live="polite"></p>
      </section>
      <section id="shortbit-content" class="shortbit-content" hidden>
        <p class="system-kicker">SHORTBIT // MASKED DESTINATION</p>
        <h1 id="shortbit-title">SHORTBIT</h1>
        <p id="shortbit-description"></p>
        <div id="shortbit-frame-shell" class="shortbit-frame-shell" hidden>
          <iframe
            id="shortbit-frame"
            title="Embedded ShortBit destination"
            allow="autoplay; encrypted-media; fullscreen; picture-in-picture"
          ></iframe>
        </div>
        <p id="shortbit-notice" class="shortbit-notice"></p>
        <nav class="error-actions" aria-label="ShortBit options">
          <a id="shortbit-open" target="_blank" rel="noreferrer">&gt; OPEN_DESTINATION ↗</a>
          <a href="/online/">&gt; RETURN_HOME</a>
        </nav>
      </section>
    </main>
  </body>
</html>
